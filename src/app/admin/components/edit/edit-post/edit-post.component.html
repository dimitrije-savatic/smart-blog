<section class="text-gray-600 body-font h-screen">
  <div class="container py-12 mx-auto flex flex-col h-full items-center justify-around">
    <div class="md:w-2/5 bg-gray-100 p-8 flex flex-col w-full mt-10 mb-14 md:mt-0">
      <h2 class="text-gray-900 text-lg font-medium title-font mb-5">
        Edit Post
      </h2>
      <form [formGroup]="formEditPost">
        <div class="relative mb-4">
          <mat-form-field appearance="fill" style="width: 100%">
            <mat-label>Title</mat-label>
            <input matInput formControlName="title" />
            <mat-error *ngIf="formEditPost.get('title').hasError('required')">
              Title is required.
            </mat-error>
            <mat-error *ngIf="formEditPost.get('title').hasError('minLength')">
              Title has to be at least 5 characters long.
            </mat-error>
            <mat-error *ngIf="formEditPost.get('title').hasError('maxLength')">
              Title could not be more than 100 characters long.
            </mat-error>
          </mat-form-field>
        </div>
        <div class="relative mb-4">
          <mat-form-field style="width: 100%">
            <mat-label>Content</mat-label>
            <textarea matInput formControlName="body" style="max-height: 6rem; min-height: 3rem"></textarea>
            <mat-error *ngIf="formEditPost.get('body').hasError('required')">
              Content is required.
            </mat-error>
            <mat-error *ngIf="formEditPost.get('body').hasError('minLength')">
              Content has to be at least 10 characters long.
            </mat-error>
          </mat-form-field>
        </div>
        <div class="relative mb-4">
          @for (cat of categories; track cat) {
          <mat-checkbox color="primary" [checked]="isSelected(cat.id)"
            (change)="onCategoryChange($event.checked, cat.id)">{{cat.name}}</mat-checkbox>
          }
        </div>
        <button mat-raised-button color="primary" style="width: 100%"
          (click)="updatePost(formEditPost.get('title').value, formEditPost.get('body').value, post.author?.id, formEditPost.get('category').value)"
          [disabled]="formEditPost.invalid">
          Submit
        </button>
      </form>
    </div>
  </div>
</section>
