<section class="text-gray-600 body-font">
  <div class="container px-5 py-24 mx-auto">
    <div class="flex flex-col text-center w-full mb-10">
      <h1 class="text-3xl font-medium title-font text-gray-900 text-center mb-4">Latest Stories</h1>
      <p class="lg:w-2/3 mx-auto leading-relaxed text-base">Check out our most famous stories.</p>
    </div>
    <div class="flex flex-wrap m-4">
      @for (post of latestPosts; track post.id) {
      <app-hero-block class="p-4 lg:w-1/3" [post]="post"></app-hero-block>
      }
    </div>
  </div>
</section>
