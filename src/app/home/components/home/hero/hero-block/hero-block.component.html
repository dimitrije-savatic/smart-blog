<div class="h-full bg-gray-100 bg-opacity-75 px-8 pt-16 pb-24 rounded-lg overflow-hidden text-center relative">
  <div class="flex flex-wrap mb-5 justify-evenly">
    @for(cat of post.categories; track cat.id) {
    <h2 class="tracking-widest text-xs title-font font-medium text-gray-400 mb-1">{{cat.name | uppercase}}</h2>
    }
  </div>
  <h1 class="title-font sm:text-2xl text-xl font-medium text-gray-900 mb-3">
    {{ post.title }}
  </h1>
  <p class="leading-relaxed mb-3">
    {{ post.body.substring(0, 100) }}...
  </p>
  <a class="text-green-500 inline-flex items-center" routerLink="/posts/post/{{ post.id }}">Learn More
    <svg class="w-4 h-4 ml-2" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"></path>
      <path d="M12 5l7 7-7 7"></path>
    </svg>
  </a>
  <div class="text-center mt-2 leading-none flex justify-center absolute bottom-0 left-0 w-full py-4">
    <span class="text-gray-700 mr-3 inline-flex leading-none text-md pr-3 py-1 border-r-2 border-gray-200">
      <p class="mr-1">{{reactions.length}}</p>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4 text-green-500">
        <path
          d="M2.09 15a1 1 0 0 0 1-1V8a1 1 0 1 0-2 0v6a1 1 0 0 0 1 1ZM5.765 13H4.09V8c.663 0 1.218-.466 1.556-1.037a4.02 4.02 0 0 1 1.358-1.377c.478-.292.907-.706.989-1.26V4.32a9.03 9.03 0 0 0 0-2.642c-.028-.194.048-.394.224-.479A2 2 0 0 1 11.09 3c0 .812-.08 1.605-.235 2.371a.521.521 0 0 0 .502.629h1.733c1.104 0 2.01.898 1.901 1.997a19.831 19.831 0 0 1-1.081 4.788c-.27.747-.998 1.215-1.793 1.215H9.414c-.215 0-.428-.035-.632-.103l-2.384-.794A2.002 2.002 0 0 0 5.765 13Z" />
      </svg>
    </span>
  </div>
</div>
