<div class="h-full border-2 border-gray-200 border-opacity-60 rounded-lg overflow-hidden">
  <img class="lg:h-48 md:h-36 w-full object-cover object-center" src="assets/images/nature.jpg" alt="blog">
  <div class="p-6">
    <div class="flex flex-wrap justify-start">
      @for(cat of post.categories; track cat.id) {
      <h2 class="tracking-widest text-xs title-font font-medium text-gray-400 mb-2 mr-2">{{cat.name | uppercase}}</h2>
      }
    </div>
    <h1 class="title-font text-lg font-medium text-gray-900 mb-3">{{ post.title }}</h1>
    <p class="leading-relaxed mb-3">{{ post.body.substring(0, 100) }}...</p>
    <div class="flex items-center flex-wrap ">
      <a class="text-green-500 inline-flex items-center md:mb-2 lg:mb-0" routerLink="/posts/post/{{ post.id }}">Learn
        More
        <ng-icon [name]="'heroArrowRight'" class="w-4 h-4 ml-2"></ng-icon>
      </a>
      <span
        class="text-gray-400 mr-3 inline-flex items-center lg:ml-auto md:ml-0 ml-auto leading-none text-sm pr-3 py-1 border-r-2 border-gray-200">
        <ng-icon [name]="'heroEye'" class="w-4 h-4 mr-1"></ng-icon>{{post?.views_count ?? 0}}
      </span>
      <span class="text-gray-400 inline-flex items-center leading-none text-sm">
        <ng-icon [name]="'heroChatBubbleLeftRight'" class="w-4 h-4 mr-1"></ng-icon>{{post?.comments_count ?? 0}}
      </span>
    </div>
  </div>
</div>
