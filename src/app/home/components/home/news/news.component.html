<section class="text-gray-600 body-font overflow-hidden border-b">
  <div class="flex flex-col text-center w-full">
    <h1 class="text-3xl font-medium title-font text-gray-900 mb-4 text-center">
      Most Famous Stories
    </h1>
    <p class="lg:w-2/3 mx-auto leading-relaxed text-base">{{description}}</p>
  </div>
  <div class="container px-5 py-24 mx-auto">
    <div class="grid grid-cols-2 gap-8">
      <app-news-block *ngFor="let post of lastEightPosts" [post]="post"
        class="py-8 px-4 border-2 rounded-lg border-gray-100"></app-news-block>
    </div>
  </div>
</section>
<div class="w-full inline-flex justify-center mx-auto lg:ml-0 mt-10 py-5">
  <app-button [name]="newsButtonTitle" routerLink="/posts"
    class="border border-white bg-green-500 rounded hover:border-gray-300 text-white hover:text-green-500 hover:bg-gray-100"></app-button>
</div>
