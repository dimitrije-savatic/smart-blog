<section class="text-gray-600 body-font">
  <div class="container px-5 py-20 mx-auto">
    <div class="flex flex-wrap p-4">
      <section class="w-full rounded border border-gray-200 bg-white p-5 mb-5 shadow-sm">
        <div class="flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">

          <!-- Search -->
          <div class="w-full lg:max-w-md">
            <label for="search" class="mb-2 block text-sm font-medium text-gray-700">
              Search posts
            </label>

            <div class="relative">
              <svg class="absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
              </svg>

              <input id="search" type="text" placeholder="Search posts..." [(ngModel)]="search"
                (ngModelChange)="searchSubject.next($event)"
                class="w-full rounded-lg border border-gray-300 bg-gray-50 py-2.5 pl-10 pr-4 text-sm text-gray-900 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500/20" />
            </div>
          </div>

          <!-- Category -->
          <div class="w-full lg:w-56">
            <label for="category" class="mb-2 block text-sm font-medium text-gray-700">
              Category
            </label>

            <select id="category" [(ngModel)]="selectedCategory" (ngModelChange)="filterPosts()"
              class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm text-gray-700 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500/20">
              <option value="">All categories</option>
              <option *ngFor="let category of categories" [value]="category.id">{{ category.name | capitalize }}
              </option>
            </select>
          </div>

          <!-- Sort -->
          <div class="w-full lg:w-56">
            <label for="sort" class="mb-2 block text-sm font-medium text-gray-700">
              Sort by
            </label>

            <select id="sort" [(ngModel)]="sortBy" (ngModelChange)="filterPosts()"
              class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-2.5 text-sm text-gray-700 outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-500/20">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="most-viewed">Most viewed</option>
              <option value="most-liked">Most liked</option>
            </select>
          </div>

          <!-- Reset -->
          <button type="button" (click)="resetFilters()"
            class="inline-flex h-[42px] items-center justify-center gap-2 rounded-lg border border-gray-300 px-4 text-sm font-medium text-gray-700 transition hover:border-gray-400 hover:bg-gray-50">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h5M20 20v-5h-5M5.5 15a7 7 0 0 0 11.8 1.1L20 14M4 10l2.7-2.1A7 7 0 0 1 18.5 9" />
            </svg>

            Reset
          </button>

        </div>
      </section>
      @for (post of paginatedPosts; track post.id) {
      <app-posts-block [post]="post" class="p-4 lg:w-1/3"></app-posts-block>
      }
    </div>
    <mat-paginator #paginator [pageSize]="perPage" [pageSizeOptions]="[6, 12, 18]" showFirstLastButtons
      [length]="posts.length" (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</section>
