<section class="text-gray-600 body-font">
  <div class="container px-5 py-24 mx-auto">
    <div class="flex flex-wrap m-4">
      @for (post of paginatedPosts; track $index) {
      <app-posts-block [post]="post" class="p-4 lg:w-1/3"></app-posts-block>
      }
    </div>
    <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[6, 12, 18]" showFirstLastButtons
      [length]="posts.length" (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</section>
