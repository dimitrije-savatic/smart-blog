<div class=" h-full bg-gray-100 bg-opacity-75 px-8 pt-16 pb-24 rounded-lg overflow-hidden text-center relative">
  <div class="flex items-center justify-center justify-evenly mb-2">
    @for (cat of post?.categories; track cat.id) {
    <h2 class="tracking-widest text-xs title-font font-medium text-gray-400 mb-1">{{cat.name | uppercase}}</h2>
    }
  </div>
  <h1 class="title-font sm:text-2xl text-xl font-medium text-gray-900 mb-3">{{post.title}}
  </h1>
  <p class="leading-relaxed mb-3">{{post.body.substring(0,150)}}...</p>
  <a class="text-green-500 inline-flex items-center" routerLink="/posts/post/{{post.id}}">Learn More
    <ng-icon [name]="'heroArrowRight'" class="ml-2"></ng-icon>
  </a>
  <div class="text-center mt-2 leading-none flex justify-center absolute bottom-0 left-0 w-full py-4">
    <span class="text-gray-400 mr-3 inline-flex items-center leading-none text-sm pr-3 py-1 border-r-2 border-gray-200">
      <ng-icon [name]="'heroEye'" class="mr-1"></ng-icon>{{post?.views_count}}
    </span>
    <span class="text-gray-400 inline-flex items-center leading-none text-sm">
      <ng-icon [name]="'heroChatBubbleLeftRight'" class="mr-1"></ng-icon>{{post?.comments_count}}
    </span>
  </div>
</div>
