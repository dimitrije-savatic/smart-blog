<section *ngIf="post?.comments.length > 0" class="text-gray-600 body-font relative border-t">
  <div class="container px-5 py-12 mx-auto">
    <div class="flex flex-col text-center w-full mb-12">
      <h1 class="sm:text-3xl text-2xl font-medium title-font mb-2 text-gray-900">
        Comments
      </h1>
    </div>
    <div class="lg:w-full md:w-2/3 mx-auto">

      @for (com of post?.comments; track com){
      <div class="flex gap-3 p-4 border-b border-green-200">
        <!-- User Icon -->
        <div class="flex-shrink-0">
          <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center">
            <!-- User icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="w-6 h-6 text-gray-500">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a8.25 8.25 0 0 1 15 0" />
            </svg>
          </div>
        </div>

        <!-- Comment Content -->
        <div class="flex-1 min-w-0">

          <!-- Header -->
          <div class="flex items-center justify-between">

            <!-- Username -->
            <span class="font-semibold text-gray-900">
              {{com.user?.first_name + ' ' + com.user?.last_name}}
            </span>

            <!-- Actions -->
            <div class="flex items-center gap-2">

              <!-- Heart Reaction -->
              <button type="button"
                class="p-1.5 rounded-full text-gray-500 hover:text-red-500 hover:bg-red-50 transition block"
                title="React">
                <ng-icon [name]="com?.users_reaction ? 'heroHeartSolid' : 'heroHeart'"
                  class="cursor-pointer text-red-700" size="24"
                  (click)="addReaction(com?.id, parsedUser?.id, 'comment', 'heart')"></ng-icon>
              </button>

              <!-- Three Dots Menu -->
              <div class="relative">

                <button type="button" class="p-1.5 rounded-full text-gray-500 hover:bg-gray-100 transition"
                  title="More options" (click)="toggleMenu(com.id)">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-5 h-5">
                    <path
                      d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2Zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Z" />
                  </svg>
                </button>

                <!-- Dropdown -->
                <div *ngIf="activeMenuCommentId"
                  class="absolute right-0 top-9 z-10 w-32 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden">
                  <button type="button"
                    class="w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 transition">
                    Edit
                  </button>

                  <button type="button"
                    class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 transition">
                    Delete
                  </button>
                </div>

              </div>
            </div>
          </div>

          <!-- Comment Text -->
          <p class="mt-1 text-gray-700 leading-relaxed">
            {{com.body}}
          </p>

        </div>
      </div>
      }
    </div>
  </div>
</section>
